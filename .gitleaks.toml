# Gitleaks: the default rules, plus the few exceptions below. Keep this list short and explain each.
[extend]
useDefault = true

[[allowlists]]
description = "The public example VAPID public key from the web-push documentation. Commit a305760 used it in two frontend test helpers; they now build a placeholder instead. It is a public key, not a secret."
regexes = ['''BEl62iUYgUivxIkv69yViEuiBIa-Ib9-SkvMeAtA3LFgDzkrxZJjSgSnfckjBJuBkr3qBUYIHBQFLXYp5Nksh8U''']

[[allowlists]]
description = "The sample Sec-WebSocket-Key from RFC 6455 section 1.3 ('the sample nonce'). Commit e97296c used it in deploy/ci/nginx-smoke.sh to test the WebSocket upgrade; the script now generates a random key. It is a published example, not a secret."
regexes = ['''dGhlIHNhbXBsZSBub25jZQ==''']
