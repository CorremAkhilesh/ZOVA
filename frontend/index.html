<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="%BRAND_DESCRIPTION%" />
    <meta name="theme-color" content="%BRAND_PRIMARY%" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>%BRAND_NAME%</title>
    <script>
      // Apply the saved theme before first paint so there is no flash of the wrong theme.
      (() => {
        let dark = false;
        try {
          const saved = JSON.parse(localStorage.getItem('zuvo-theme') || '{}');
          const mode = saved.state?.mode || 'system';
          dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        } catch {
          // Storage blocked: fall back to light.
        }
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
