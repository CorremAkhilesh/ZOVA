<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="%BRAND_DESCRIPTION%" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="%THEME_LIGHT%" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="%THEME_DARK%" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="%APPLE_TOUCH_ICON%" />
    <!-- Installable on iOS / iPadOS (Add to Home Screen) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="%BRAND_NAME%" />
    <!-- PWA:SPLASH -->
    <title>%BRAND_NAME%</title>
    <script>
      // Apply the saved theme before first paint so there is no flash of the wrong theme.
      (() => {
        let dark = false;
        try {
          const saved = JSON.parse(localStorage.getItem('zuvo-theme') || '{}');
          const mode = saved.state?.mode || 'system';
          dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        } catch {
          // Storage blocked: fall back to light.
        }
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        // The accent this device used last (features/appearance/accent.ts).
        try {
          const accent = localStorage.getItem('zuvo-accent');
          if (accent && /^[a-z]+$/.test(accent)) document.documentElement.dataset.accent = accent;
        } catch {
          // Storage blocked: the default accent.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
