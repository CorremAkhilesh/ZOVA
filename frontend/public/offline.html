<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f6fa;
        --surface: #ffffff;
        --text: #0f172a;
        --muted: #5b6476;
        --brand: #4f46e5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0d17;
          --surface: #12152a;
          --text: #e8eaf6;
          --muted: #9aa3c0;
        }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        max-width: 22rem;
        margin: 1rem;
        padding: 2rem;
        text-align: center;
        background: var(--surface);
        border-radius: 1.5rem;
      }
      img {
        width: 64px;
        height: 64px;
      }
      p {
        color: var(--muted);
      }
      button {
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: var(--brand);
        border: 0;
        border-radius: 0.75rem;
        padding: 0.7rem 1.4rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" />
      <h1>You’re offline</h1>
      <p>The app couldn’t load. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
