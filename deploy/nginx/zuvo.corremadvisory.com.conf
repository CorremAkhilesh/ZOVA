# /etc/nginx/sites-available/zuvo.corremadvisory.com (+ symlink in sites-enabled). Zuvo only: no other
# site is touched. Install: docs/runbooks/first-deploy.md step 5 (always `sudo nginx -t` before reload).
#
#   /            → web container  127.0.0.1:7147 (static PWA) + security headers + cache rules
#   /v1/         → API container  127.0.0.1:7148 (the API sets its own security headers)
#   /socket.io/  → API container  127.0.0.1:7148 (WebSocket upgrade, long timeouts)
#
# Written for Nginx 1.24 (Ubuntu 24.04): `listen 443 ssl http2`. On 1.25.1+ that still works (with a
# deprecation warning). Certificates come from `certbot certonly --nginx` (this file is not edited by
# certbot). The security headers snippet is generated from shared/config/src/security-headers.ts:
# copy infra/nginx/security-headers.conf to /etc/nginx/snippets/zuvo-security-headers.conf.

# Zuvo-only name, so it cannot clash with a `$connection_upgrade` map of another site.
map $http_upgrade $zuvo_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name zuvo.corremadvisory.com;
    # Certbot renewals add their own challenge location here for a moment; everything else → HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name zuvo.corremadvisory.com;

    ssl_certificate /etc/letsencrypt/live/zuvo.corremadvisory.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zuvo.corremadvisory.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    access_log /var/log/nginx/zuvo.access.log;
    error_log /var/log/nginx/zuvo.error.log warn;

    # Compression for text (the app shell, JS, CSS, JSON). Media is already compressed.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/manifest+json application/xml image/svg+xml;
    # Brotli, only if the module is installed (`nginx -V 2>&1 | grep -o brotli`); then uncomment:
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css text/xml application/javascript application/json
    #              application/manifest+json application/xml image/svg+xml;

    # --- API --------------------------------------------------------------------------------------
    # Largest request: an 8 MB upload chunk or a 10 MB wallpaper (+ multipart overhead).
    location /v1/ {
        proxy_pass http://127.0.0.1:7148;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwritten, not appended: a client can never inject a fake hop (rate limits use this).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        client_max_body_size 12m;
        client_body_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Chunked uploads: an 8 MB chunk may take 10+ minutes on a slow phone link, and
    # POST /v1/uploads/:id/complete hashes and stores up to 1 GB, which can take minutes.
    location /v1/uploads/ {
        proxy_pass http://127.0.0.1:7148;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        client_max_body_size 12m;
        client_body_timeout 15m;
        proxy_send_timeout 15m;
        proxy_read_timeout 15m;
    }

    # Media downloads (up to 1 GB, HTTP ranges for seeking): streamed, never buffered to disk here.
    location /v1/media/ {
        proxy_pass http://127.0.0.1:7148;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 12m;
        client_body_timeout 300s;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
    }

    # --- Realtime ---------------------------------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://127.0.0.1:7148;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $zuvo_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # Idle WebSockets stay open (Socket.IO pings every 25 s).
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # --- The app (static) -------------------------------------------------------------------------
    # `add_header` is not inherited into a location with its own add_header: every app location
    # includes the snippet itself. Never include it in /v1/ or /socket.io/ (two CSPs would apply).

    # Vite's hashed files: cached for a year, never revalidated.
    location /assets/ {
        proxy_pass http://127.0.0.1:7147;
        proxy_set_header Host $host;
        include /etc/nginx/snippets/zuvo-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The service worker and the shell must be revalidated on every load, or updates never arrive.
    location = /sw.js {
        proxy_pass http://127.0.0.1:7147;
        proxy_set_header Host $host;
        include /etc/nginx/snippets/zuvo-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        proxy_pass http://127.0.0.1:7147;
        proxy_set_header Host $host;
        include /etc/nginx/snippets/zuvo-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Everything else (routes → index.html, icons, manifest, theme-init.js): revalidate (ETag).
    location / {
        proxy_pass http://127.0.0.1:7147;
        proxy_set_header Host $host;
        include /etc/nginx/snippets/zuvo-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
