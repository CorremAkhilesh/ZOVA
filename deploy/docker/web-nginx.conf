# Web container (deploy/docker/web.Dockerfile): static files only. TLS, HTTP/2, gzip, the security
# headers and Cache-Control are added by the host Nginx (deploy/nginx/zuvo.corremadvisory.com.conf).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;

    # Docker healthcheck and correm-deploy (127.0.0.1:7155/health). No backend call.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build output: a missing file is a 404, never the app shell (which would be cached forever).
    location /assets/ {
        try_files $uri =404;
    }

    location = /sw.js {
        try_files $uri =404;
    }

    # Single-page app: unknown paths get the shell; the router shows the right screen.
    location / {
        try_files $uri /index.html;
    }
}
