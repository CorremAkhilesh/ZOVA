name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per branch: a newer push cancels the outdated run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# CI never touches Atlas, real SMTP or any secret: everything below is fake and local to the runner.
env:
  NODE_ENV: test
  TURBO_TELEMETRY_DISABLED: 1
  LEFTHOOK: 0

jobs:
  quality:
    name: Quality (Biome + typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Biome (lint + format)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

  test-backend:
    name: Backend + shared tests (coverage ≥ 80%)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Fake, runner-local values only.
      REDIS_PASSWORD: ci-redis-password
      REDIS_TEST_URL: redis://:ci-redis-password@127.0.0.1:6379/15
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # A plain `services:` container cannot take redis-server arguments, so Redis is started
      # here with a password and noeviction, then health-checked before the tests run.
      - name: Start Redis (password-protected, noeviction)
        run: |
          docker run -d --name redis -p 127.0.0.1:6379:6379 redis:8-alpine \
            redis-server --requirepass "$REDIS_PASSWORD" --maxmemory 256mb \
            --maxmemory-policy noeviction --appendonly no
          for attempt in $(seq 1 30); do
            if docker exec redis redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG; then
              echo "Redis is healthy"; exit 0
            fi
            sleep 1
          done
          docker logs redis
          exit 1

      - name: Cache MongoDB binary (mongodb-memory-server)
        uses: actions/cache@v6
        with:
          path: ${{ env.MONGOMS_DOWNLOAD_DIR }}
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            mongodb-binaries-${{ runner.os }}-

      - name: Shared package tests
        run: pnpm --filter "./shared/*" test

      - name: Backend tests with coverage (Redis integration tests run here)
        run: pnpm --filter @zuvo/backend test:coverage

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: backend/coverage
          retention-days: 7

  test-frontend:
    name: Frontend tests (coverage ≥ 70%)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Frontend unit, component and accessibility tests with coverage
        shell: bash
        run: pnpm --filter @zuvo/frontend test:coverage 2>&1 | tee frontend-tests.log
      # Vitest only annotates failed tests. An unhandled error or a missed threshold also fails the run.
      - name: Show why the frontend tests failed
        if: failure()
        shell: bash
        run: |
          sed 's/\x1b\[[0-9;]*m//g' frontend-tests.log \
            | grep -E -A6 'Unhandled|ERROR: Coverage|does not meet|Vitest caught' \
            | head -20 | cut -c1-300 | tr -d '\r' \
            | while IFS= read -r line; do echo "::error::$line"; done
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: frontend/coverage
          retention-days: 7

  build:
    name: Build + bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      e2e-matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build all packages
        env:
          NODE_ENV: production
        run: pnpm build
      - name: Check main bundle size (gzip ≤ 200 KB)
        run: pnpm --filter @zuvo/frontend size
      # The E2E shards test this exact build (vite preview serves frontend/dist): none rebuilds it.
      - name: Upload the built app for the E2E shards
        uses: actions/upload-artifact@v7
        with:
          name: app-build
          path: |
            frontend/dist
            backend/dist
          if-no-files-found: error
          retention-days: 3
      - name: Plan the E2E shards (push → Chromium; pull request or manual run → every browser)
        id: plan
        env:
          SUITES: ${{ github.event_name == 'push' && 'dev' || 'full' }}
        run: node .github/scripts/e2e-matrix.mjs "$SUITES" >> "$GITHUB_OUTPUT"

  e2e:
    name: E2E ${{ matrix.name }} ${{ matrix.shard }}/${{ matrix.total }}
    needs: build
    runs-on: ubuntu-latest
    # About 5 minutes of tests per shard; the limit leaves room for a retry of slow tests.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.e2e-matrix) }}
    env:
      CI: true
      # The E2E API (backend e2e:server) runs on an in-memory MongoDB.
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Download the built app
        uses: actions/download-artifact@v8
        with:
          name: app-build

      - name: Playwright version
        id: playwright
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # One cache per browser and Playwright version: a shard downloads only the browser it runs.
      - name: Cache the ${{ matrix.browser }} browser
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}

      - name: Install ${{ matrix.browser }} and its system libraries
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @zuvo/frontend exec playwright install --with-deps ${{ matrix.browser }}

      # A cached browser still needs its system libraries. The runner image already has what
      # Chromium needs; Firefox and WebKit need a few more packages.
      - name: Install the system libraries for ${{ matrix.browser }}
        if: steps.browser-cache.outputs.cache-hit == 'true' && matrix.browser != 'chromium'
        run: pnpm --filter @zuvo/frontend exec playwright install-deps ${{ matrix.browser }}

      - name: Cache MongoDB binary (mongodb-memory-server)
        uses: actions/cache@v6
        with:
          path: ${{ env.MONGOMS_DOWNLOAD_DIR }}
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            mongodb-binaries-${{ runner.os }}-

      - name: Run Playwright (${{ matrix.project }}, shard ${{ matrix.shard }} of ${{ matrix.total }})
        env:
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.name }}-${{ matrix.shard }}.zip
        run: >-
          pnpm --filter @zuvo/frontend exec playwright test
          --config ${{ matrix.config }}
          --project ${{ matrix.project }}
          --shard ${{ matrix.shard }}/${{ matrix.total }}

      # Always, so the merged report covers every shard (the traces of failures are inside).
      - name: Upload the blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.name }}-${{ matrix.shard }}
          path: frontend/blob-report
          if-no-files-found: ignore
          retention-days: 7

  # The one E2E check for branch protection, whatever the matrix holds: one HTML report for all
  # shards, and green only if every shard passed.
  e2e-report:
    name: E2E
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        if: needs.e2e.result != 'skipped'
      - uses: ./.github/actions/setup
        if: needs.e2e.result != 'skipped'
      - name: Download the blob reports of all shards
        if: needs.e2e.result != 'skipped'
        uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge them into one HTML report
        if: needs.e2e.result != 'skipped'
        run: pnpm --filter @zuvo/frontend exec playwright merge-reports --reporter html ../all-blob-reports
      - name: Upload the HTML report
        if: needs.e2e.result != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: Every shard passed
        env:
          RESULT: ${{ needs.e2e.result }}
        run: |
          echo "E2E shards: $RESULT"
          test "$RESULT" = success

  security:
    name: Security (audit + secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the secret scan covers every commit.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: pnpm audit (fail on high/critical)
        run: pnpm audit --audit-level high
      - name: Gitleaks secret scan
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
