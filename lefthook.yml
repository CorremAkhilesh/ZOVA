# Git hooks — installed automatically by `pnpm install` (via the "prepare" script).
pre-commit:
  commands:
    # Internal server details stay on this machine: the repository is public.
    no-server-context:
      run: git diff --cached --name-only | grep -qi 'SERVER_CONTEXT' && { echo 'SERVER_CONTEXT.md must never be committed'; exit 1; } || exit 0
    biome:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,json,jsonc,css,md}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
